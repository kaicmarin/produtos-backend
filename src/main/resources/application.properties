# Atividade 18 - API (backend)
# Frontend original: porta 8080 | backend: porta 8081 (para nao haver conflito local)
server.port=${PORT:8081}
spring.application.name=Projeto3aAPI

# PostgreSQL - configurar a senha fora do Git/ZIP
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/projeto3aapi}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:}

# JPA/Hibernate
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Spring Boot Actuator
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always
management.endpoint.metrics.enabled=true
management.info.env.enabled=true

# Informacoes personalizadas /actuator/info
info.app.name=Projeto3aAPI
info.app.description=API REST com Spring Boot e PostgreSQL
info.app.version=1.0.0
info.app.author=Kaic Marinho Gomes
info.app.ambiente=${APP_ENV:desenvolvimento}

# Origens autorizadas para o navegador acessar o backend diretamente
# Em producao, defina FRONTEND_CORS_ORIGINS com o dominio HTTPS real
frontend.cors.allowed-origins=${FRONTEND_CORS_ORIGINS:http://localhost:8080,http://localhost:3000}
